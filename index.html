<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<meta name="description" content="Alat gratis untuk memperbaiki prompt AI dan menerjemahkan ID/EN. Cocok untuk pemula dan pelajar.">
<title>PromptFix — Perbaiki Prompt AI</title>
<style>
:root{
  --green:#16a34a; --green-dark:#15803d; --green-light:#dcfce7; --green-bg:#f0fdf4;
  --text:#111827; --muted:#6b7280; --border:#e5e7eb; --bg:#ffffff;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
  -webkit-font-smoothing:antialiased;font-size:15px;
}
.container{max-width:720px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 20px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;background:var(--green-bg);border:1.5px solid var(--green-light);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-text h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
.brand-text p{font-size:12px;color:var(--muted)}
.lang-toggle{background:var(--green-bg);color:var(--green-dark);border:1.5px solid var(--green-light);
  padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.lang-toggle:active{transform:scale(.96)}
.tabs{display:flex;gap:4px;background:#f9fafb;padding:4px;border-radius:10px;margin-bottom:20px}
.tab{flex:1;padding:8px;background:transparent;border:none;border-radius:8px;font-size:14px;
  font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:.2s}
.tab.active{background:#fff;color:var(--green-dark);box-shadow:var(--shadow);font-weight:600}
.panel{display:flex;flex-direction:column;gap:8px}
.panel.hidden{display:none}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.label{font-size:13px;font-weight:600;color:var(--text)}
.counter{font-size:12px;color:var(--muted)}
textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius);
  font-family:inherit;font-size:14px;line-height:1.6;resize:vertical;outline:none;
  transition:.2s;background:#fff;color:var(--text)}
textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-bg)}
textarea::placeholder{color:#9ca3af}
.samples{display:flex;flex-direction:column;gap:6px;margin:4px 0}
.samples-label{font-size:12px;color:var(--muted);font-weight:500}
.sample-list{display:flex;flex-wrap:wrap;gap:6px}
.sample{background:var(--green-bg);color:var(--green-dark);border:1px solid var(--green-light);
  padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;
  transition:.15s;text-align:left;line-height:1.35}
.sample:active{transform:scale(.96)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1.5px solid var(--border);padding:6px 12px;border-radius:20px;
  font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s;font-weight:500}
.chip.active{background:var(--green);border-color:var(--green);color:#fff}
.chip:active{transform:scale(.96)}
.btn-primary{width:100%;padding:12px;background:var(--green);color:#fff;border:none;
  border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;
  font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary:hover{background:var(--green-dark)}
.btn-primary:active{transform:scale(.99)}
.btn-primary:disabled{opacity:.6;cursor:wait}
.result{margin-top:16px;border:1.5px solid var(--green-light);background:var(--green-bg);
  border-radius:var(--radius);padding:12px 14px}
.result.hidden{display:none}
.result-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.badge{font-size:11px;font-weight:600;color:var(--green-dark);background:#fff;
  padding:4px 10px;border-radius:20px;border:1px solid var(--green-light);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-copy{background:#fff;color:var(--green-dark);border:1px solid var(--green-light);
  padding:5px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s;flex-shrink:0}
.btn-copy:active{transform:scale(.96)}
pre#resultText{white-space:pre-wrap;word-wrap:break-word;
  font-family:'SF Mono',Monaco,'Cascadia Code',Consolas,monospace;font-size:13px;line-height:1.6;
  color:var(--text);background:#fff;padding:12px;border-radius:8px;border:1px solid var(--border);
  max-height:400px;overflow-y:auto}
.hint{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.dir-row{display:flex;gap:6px;margin-bottom:4px}
.dir-pill{flex:1;padding:8px;background:#fff;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;font-family:inherit;transition:.15s}
.dir-pill.active{background:var(--green);border-color:var(--green);color:#fff}
footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--border)}
footer p{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
  opacity:0;transition:.25s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  .container{padding:12px 12px 30px}
  .brand-text h1{font-size:16px}
  .brand-text p{font-size:11px}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="logo">✨</div>
      <div class="brand-text">
        <h1 id="appTitle">PromptFix</h1>
        <p id="appSubtitle">Perbaiki prompt AI kamu</p>
      </div>
    </div>
    <button class="lang-toggle" id="langToggle">EN</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="improve" id="tabImprove">Perbaiki</button>
    <button class="tab" data-tab="translate" id="tabTranslate">Terjemahkan</button>
  </div>

  <section class="panel" id="panelImprove">
    <div class="field-head">
      <label class="label" id="lblPrompt">Prompt Kamu</label>
      <span class="counter" id="counter">0</span>
    </div>
    <textarea id="promptInput" rows="4" placeholder="Tulis prompt kamu di sini..."></textarea>

    <div class="samples">
      <span class="samples-label" id="samplesLabel">Contoh:</span>
      <div class="sample-list" id="sampleList"></div>
    </div>

    <div class="field-head">
      <label class="label" id="lblMode">Mode</label>
    </div>
    <div class="chips" id="modeChips"></div>

    <button class="btn-primary" id="btnImprove">
      <span id="btnImproveText">✨ Perbaiki Prompt</span>
    </button>

    <div class="result hidden" id="result">
      <div class="result-head">
        <span class="badge" id="detected"></span>
        <button class="btn-copy" id="btnCopy">Salin</button>
      </div>
      <pre id="resultText"></pre>
    </div>
    <p class="hint" id="resultHint" style="display:none"></p>
  </section>

  <section class="panel hidden" id="panelTranslate">
    <div class="dir-row">
      <button class="dir-pill active" data-dir="id|en" id="dirIDEN">ID → EN</button>
      <button class="dir-pill" data-dir="en|id" id="dirENID">EN → ID</button>
    </div>
    <textarea id="srcText" rows="4" placeholder="Tulis teks di sini..."></textarea>
    <button class="btn-primary" id="btnTranslate">Terjemahkan</button>
    <div class="field-head" style="margin-top:12px">
      <label class="label" id="lblResultTrans">Hasil</label>
      <button class="btn-copy" id="btnCopyTrans">Salin</button>
    </div>
    <textarea id="dstText" rows="4" readonly placeholder="Hasil terjemahan..."></textarea>
  </section>

  <footer>
    <p id="footerText">Dibuat untuk pemula · Tanpa API key · Gratis</p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  /* ---------- DOM ---------- */
  const $ = id => document.getElementById(id);
  const appSubtitle = $('appSubtitle'), langToggle = $('langToggle');
  const tabImprove = $('tabImprove'), tabTranslate = $('tabTranslate');
  const panelImprove = $('panelImprove'), panelTranslate = $('panelTranslate');
  const lblPrompt = $('lblPrompt'), counter = $('counter'), promptInput = $('promptInput');
  const samplesLabel = $('samplesLabel'), sampleList = $('sampleList');
  const lblMode = $('lblMode'), modeChips = $('modeChips');
  const btnImprove = $('btnImprove'), btnImproveText = $('btnImproveText');
  const result = $('result'), detected = $('detected'), btnCopy = $('btnCopy');
  const resultText = $('resultText'), resultHint = $('resultHint');
  const srcText = $('srcText'), dstText = $('dstText'), btnTranslate = $('btnTranslate');
  const lblResultTrans = $('lblResultTrans'), btnCopyTrans = $('btnCopyTrans');
  const footerText = $('footerText');

  /* ---------- State ---------- */
  let currentLang = 'id';
  let currentMode = 'auto';
  let currentDir = 'id|en';

  /* ---------- UI Text ---------- */
  const UI = {
    id: {
      subtitle: 'Perbaiki prompt AI kamu jadi lebih baik',
      tabImprove: 'Perbaiki Prompt', tabTranslate: 'Terjemahkan',
      lblPrompt: 'Prompt Kamu',
      placeholderPrompt: 'Tulis prompt kamu di sini...\nContoh: buatkan aku cara belajar Python dari nol',
      samplesLabel: 'Coba contoh:',
      lblMode: 'Mode:',
      btnImprove: '✨ Perbaiki Prompt', btnImproving: 'Memproses...',
      copy: 'Salin', copied: '✓ Tersalin',
      hint: 'Tempel prompt di atas ke ChatGPT, Claude, Gemini, atau AI favoritmu.',
      translateBtn: 'Terjemahkan', translateLoading: 'Menerjemahkan...',
      lblResultTrans: 'Hasil',
      placeholderSrc: 'Tulis teks di sini...',
      placeholderDst: 'Hasil terjemahan akan muncul di sini...',
      footer: 'Dibuat untuk pemula · Tanpa API key · Gratis',
      errEmpty: 'Tulis prompt dulu ya.',
      errTransEmpty: 'Tulis teks dulu ya.',
      errTransFail: 'Gagal menerjemahkan. Cek koneksi internet atau coba lagi nanti (layanan gratis punya batas harian).',
      badgeLang: 'Bahasa', badgeMode: 'Mode'
    },
    en: {
      subtitle: 'Make your AI prompts better',
      tabImprove: 'Improve Prompt', tabTranslate: 'Translate',
      lblPrompt: 'Your Prompt',
      placeholderPrompt: 'Write your prompt here...\nExample: teach me Python from scratch',
      samplesLabel: 'Try examples:',
      lblMode: 'Mode:',
      btnImprove: '✨ Improve Prompt', btnImproving: 'Processing...',
      copy: 'Copy', copied: '✓ Copied',
      hint: 'Paste the prompt above into ChatGPT, Claude, Gemini, or your favorite AI.',
      translateBtn: 'Translate', translateLoading: 'Translating...',
      lblResultTrans: 'Result',
      placeholderSrc: 'Write text here...',
      placeholderDst: 'Translation will appear here...',
      footer: 'Built for beginners · No API key · Free',
      errEmpty: 'Please write a prompt first.',
      errTransEmpty: 'Please write some text first.',
      errTransFail: 'Translation failed. Check your internet or try again later (free service has daily limits).',
      badgeLang: 'Language', badgeMode: 'Mode'
    }
  };

  const MODE_LABELS = {
    id: { auto:'Auto', general:'Umum', coding:'Coding', english:'English', study:'Belajar', writing:'Menulis', creative:'Kreatif' },
    en: { auto:'Auto', general:'General', coding:'Coding', english:'English', study:'Study', writing:'Writing', creative:'Creative' }
  };

  const SAMPLES = {
    id: [
      'Buatkan aku cara belajar Python dari nol',
      'Cek grammar Inggris aku: I go to school yesterday',
      'Jelaskan fotosintesis untuk anak SMA',
      'Tulis caption Instagram tentang kopi',
      'Beri ide nama brand skincare lokal'
    ],
    en: [
      'Help me debug my JavaScript code',
      'Explain photosynthesis for high school',
      'Write an Instagram caption about coffee',
      'Teach me English grammar from scratch',
      'Give me 5 business ideas for students'
    ]
  };

  /* ---------- Language detection ---------- */
  const ID_WORDS = new Set(['yang','dan','untuk','dengan','saya','aku','kamu','ini','itu','bisa','akan','dari','ke','di','apa','bagaimana','buat','buatkan','tolong','cara','adalah','tidak','ya','sudah','belum','mau','ingin','gimana','kenapa','kapan','dimana','atau','juga','pada','oleh','banyak','sedikit','lebih','kurang','kalau','jika','karena','tetapi','tapi','saja','sekali','banget','nih','dong','sih','udah','aja','gak','nggak','enggak','bikin','tulis','jelaskan','berikan','carikan','harus','boleh','mungkin','masih','selalu','sering','jarang','pernah','mohon','terima','kasih']);
  const EN_WORDS = new Set(['the','and','for','with','i','you','this','that','can','will','from','to','in','what','how','make','please','way','is','not','yes','already','want','or','also','on','by','many','few','more','less','if','because','but','only','very','let','about','be','are','was','were','have','has','do','does','did','my','your','our','their','he','she','it','we','they','me','help','need','give','show','explain','write','create','build','some','any','all','just','like','know','think','see','get']);

  function detectLang(text) {
    const words = (text.toLowerCase().match(/[a-z]+/g) || []);
    let id = 0, en = 0;
    for (const w of words) {
      if (ID_WORDS.has(w)) id++;
      if (EN_WORDS.has(w)) en++;
    }
    if (id === 0 && en === 0) return 'id';
    return id >= en ? 'id' : 'en';
  }

  /* ---------- Mode detection ---------- */
  const MODE_KEYWORDS = {
    coding: ['code','kode','coding','program','programming','javascript','python','html','css','react','node','java','php','sql','function','fungsi','debug','error','bug','script','api','database','git','terminal','npm','variable','loop','array','class','object','backend','frontend','algorithm','algoritma','compile','syntax'],
    english: ['english','inggris','grammar','translate','terjemah','translation','vocabulary','kosakata','speaking','pronunciation','pelafalan','toefl','ielts','tense','tenses','sentence','kalimat','verb','adjective','noun','preposition','conversation','percakapan','fluent','mahir'],
    study: ['belajar','study','learn','explain','jelaskan','materi','pelajaran','matematika','math','fisika','chemistry','kimia','biologi','biology','ujian','exam','tugas','homework','sejarah','history','geografi','rumus','formula','pemahaman','understand','ringkasan','summary','catatan','notes'],
    writing: ['tulis','write','tulisan','essay','esai','article','artikel','blog','caption','email','surat','letter','paragraf','paragraph','proofread','edit','revisi','draft','naskah','konten','content','copywriting'],
    creative: ['cerita','story','puisi','poem','ide','idea','brainstorm','kreatif','creative','desain','design','nama','name','slogan','merek','brand','karakter','character','plot','ending','twist']
  };

  function detectMode(text) {
    const t = text.toLowerCase();
    let best = 'general', bestScore = 0;
    for (const mode in MODE_KEYWORDS) {
      let score = 0;
      for (const kw of MODE_KEYWORDS[mode]) if (t.includes(kw)) score++;
      if (score > bestScore) { bestScore = score; best = mode; }
    }
    return best;
  }

  /* ---------- Prompt templates ---------- */
  const PROMPTS = {
    general: {
      id: {
        role: 'Kamu adalah asisten AI yang sabar, jelas, dan sangat membantu pemula. Tujuan utamamu: membuat saya benar-benar paham, bukan hanya menjawab.',
        instructions: [
          'Jawab dengan Bahasa Indonesia sederhana yang mudah dipahami pemula.',
          'Jika ada istilah teknis, jelaskan artinya dengan singkat.',
          'Berikan contoh konkret bila relevan.',
          'Jika permintaan saya kurang jelas, ajukan 1–2 pertanyaan klarifikasi dulu sebelum menjawab.',
          'Jangan mengubah maksud permintaan saya. Fokus pada apa yang saya tanyakan.'
        ],
        format: [
          'Ringkasan singkat (1–2 kalimat).',
          'Penjelasan bertahap dalam poin-poin.',
          'Contoh nyata bila relevan.',
          'Langkah selanjutnya yang bisa saya lakukan.'
        ]
      },
      en: {
        role: 'You are a patient, clear, and highly helpful AI assistant for beginners. Your main goal is to make me truly understand, not just answer.',
        instructions: [
          'Answer in simple English that a beginner can easily understand.',
          'If there is technical jargon, explain it briefly.',
          'Give concrete examples when relevant.',
          'If my request is unclear, ask 1–2 clarifying questions before answering.',
          'Do not change the intent of my request. Focus on what I actually asked.'
        ],
        format: [
          'Short summary (1–2 sentences).',
          'Step-by-step explanation in bullet points.',
          'A real example if relevant.',
          'Next steps I can take.'
        ]
      }
    },
    coding: {
      id: {
        role: 'Kamu adalah senior software engineer yang sabar mengajar pemula. Kamu menulis kode bersih, aman, dan mudah dipahami.',
        instructions: [
          'Jika informasi kurang (bahasa pemrograman, versi, atau error), tanyakan dulu sebelum menebak.',
          'Berikan kode lengkap yang bisa langsung dijalankan.',
          'Tambahkan komentar singkat di bagian penting.',
          'Jelaskan alasan di balik setiap keputusan teknis.',
          'Sebutkan error umum yang sering muncul dan cara mengatasinya.',
          'Jangan mengubah struktur kode saya tanpa alasan jelas. Jika perlu diubah, jelaskan kenapa.'
        ],
        format: [
          'Ringkasan solusi (1–2 kalimat).',
          'Kode lengkap dalam code block dengan nama bahasa.',
          'Penjelasan tiap bagian penting.',
          'Daftar error umum + solusinya.',
          'Tips best practice untuk pemula.'
        ]
      },
      en: {
        role: 'You are a senior software engineer who patiently teaches beginners. You write clean, safe, and easy-to-understand code.',
        instructions: [
          'If information is missing (language, version, or error), ask first instead of guessing.',
          'Provide complete, runnable code.',
          'Add short comments at important parts.',
          'Explain the reason behind each technical decision.',
          'Mention common errors and how to fix them.',
          'Do not change my code structure without a clear reason. If it must change, explain why.'
        ],
        format: [
          'Short solution summary (1–2 sentences).',
          'Complete code in a code block with the language name.',
          'Explanation of key parts.',
          'List of common errors + fixes.',
          'Best-practice tips for beginners.'
        ]
      }
    },
    english: {
      id: {
        role: 'Kamu adalah guru Bahasa Inggris berpengalaman yang mengajar penutur Bahasa Indonesia. Kamu sabar, teliti, dan menjelaskan aturan dengan sederhana.',
        instructions: [
          'Jelaskan dalam Bahasa Indonesia, tapi berikan contoh dalam Bahasa Inggris.',
          'Koreksi setiap kesalahan grammar atau kosakata dalam teks saya (jika ada).',
          'Beri versi kalimat yang lebih natural, bukan hanya benar secara grammar.',
          'Jelaskan aturan grammar yang dipakai dengan singkat.',
          'Berikan 2–3 contoh kalimat tambahan.',
          'Beri tips mudah untuk mengingat aturannya.'
        ],
        format: [
          'Tabel koreksi: Kalimat Asli | Koreksi | Alasan.',
          'Penjelasan aturan grammar secara singkat.',
          'Contoh tambahan.',
          'Latihan kecil di akhir.'
        ]
      },
      en: {
        role: 'You are an experienced English teacher for Indonesian speakers. You are patient, precise, and explain rules simply.',
        instructions: [
          'Explain in Indonesian, but give examples in English.',
          'Correct every grammar or vocabulary mistake in my text (if any).',
          'Provide a more natural version, not just grammatically correct.',
          'Briefly explain the grammar rule used.',
          'Give 2–3 additional example sentences.',
          'Give an easy tip to remember the rule.'
        ],
        format: [
          'Correction table: Original | Correction | Reason.',
          'Brief grammar rule explanation.',
          'Extra examples.',
          'A small exercise at the end.'
        ]
      }
    },
    study: {
      id: {
        role: 'Kamu adalah tutor pribadi yang sabar untuk pelajar. Kamu menjelaskan konsep dari dasar dan memastikan saya benar-benar mengerti.',
        instructions: [
          'Jelaskan konsep dari dasar, anggap saya pemula.',
          'Gunakan analogi sederhana yang mudah dibayangkan.',

          'Buat ringkasan 3–5 poin penting.',
          'Berikan 3 pertanyaan latihan (jawaban di akhir).',
          'Sarankan langkah belajar selanjutnya.'
        ],
        format: [
          'Judul konsep.',
          'Penjelasan bertahap.',
          'Analogi sederhana.',
          'Contoh konkret.',
          'Ringkasan poin penting.',
          'Latihan + jawaban.'
        ]
      },
      en: {
        role: 'You are a patient personal tutor for students. You explain concepts from the ground up and make sure I truly understand.',
        instructions: [
          'Explain the concept from scratch, assume I am a beginner.',
          'Use a simple, easy-to-imagine analogy.',
          'Give a concrete example from everyday life.',
          'Create a 3–5 point summary.',
          'Provide 3 practice questions (answers at the end).',
          'Suggest the next learning step.'
        ],
        format: [
          'Concept title.',
          'Step-by-step explanation.',
          'Simple analogy.',
          'Concrete example.',
          'Key point summary.',
          'Practice + answers.'
        ]
      }
    },
    writing: {
      id: {
        role: 'Kamu adalah penulis profesional sekaligus editor teliti. Kamu menulis dengan jelas, mengalir, dan sesuai target pembaca.',
        instructions: [
          'Tanyakan dulu: siapa pembaca target, tujuan tulisan, dan nada yang diinginkan.',
          'Buat kerangka sebelum menulis.',
          'Struktur jelas: pembuka, isi, penutup.',
          'Gunakan kalimat yang mengalir dan mudah dibaca.',
          'Hindari klise dan kalimat bertele-tele.',
          'Jika relevan, tawarkan 2–3 variasi gaya.'
        ],
        format: [
          'Kerangka tulisan.',
          'Tulisan lengkap.',
          'Catatan editor (opsional).'
        ]
      },
      en: {
        role: 'You are a professional writer and meticulous editor. You write clearly, fluently, and on target for the reader.',
        instructions: [
          'First ask: who is the target reader, the purpose, and the desired tone.',
          'Create an outline before writing.',
          'Clear structure: intro, body, conclusion.',
          'Use flowing, easy-to-read sentences.',
          'Avoid clichés and wordy sentences.',
          'If relevant, offer 2–3 style variations.'
        ],
        format: [
          'Outline.',
          'Full written piece.',
          'Editor notes (optional).'
        ]
      }
    },
    creative: {
      id: {
        role: 'Kamu adalah kreator dan brainstormer imajinatif yang tetap terstruktur.',
        instructions: [
          'Berikan minimal 5 ide berbeda dengan sudut pandang beragam.',
          'Untuk setiap ide: konsep singkat + kenapa menarik + potensi kesulitan.',
          'Hindari ide klise, utamakan yang segar.',
          'Pilih 1 ide terbaik dan kembangkan lebih detail.',
          'Tanyakan preferensi saya sebelum lanjut.'
        ],
        format: [
          'Daftar ide bernomor.',
          'Ide terpilih dikembangkan.',
          'Pertanyaan lanjutan.'
        ]
      },
      en: {
        role: 'You are an imaginative yet structured creator and brainstormer.',
        instructions: [
          'Give at least 5 different ideas with varied perspectives.',
          'For each idea: short concept + why it is interesting + potential difficulty.',
          'Avoid clichés, prioritize fresh ideas.',
          'Pick the best one and develop it in more detail.',
          'Ask my preference before continuing.'
        ],
        format: [
          'Numbered idea list.',
          'Chosen idea developed.',
          'Follow-up questions.'
        ]
      }
    }
  };

  const LABELS = {
    id: { role:'[PERAN]', task:'[TUGAS SAYA]', instructions:'[INSTRUKSI]', format:'[FORMAT OUTPUT]' },
    en: { role:'[ROLE]', task:'[MY TASK]', instructions:'[INSTRUCTIONS]', format:'[OUTPUT FORMAT]' }
  };

  function buildPrompt(input, lang, mode) {
    const cfg = PROMPTS[mode][lang];
    const L = LABELS[lang];
    const parts = [];
    parts.push(L.role + '\n' + cfg.role);
    parts.push(L.task + '\n"' + input + '"');
    parts.push(L.instructions + '\n' + cfg.instructions.map((s, i) => (i + 1) + '. ' + s).join('\n'));
    parts.push(L.format + '\n' + cfg.format.map(s => '- ' + s).join('\n'));
    return parts.join('\n\n');
  }

  /* ---------- Toast ---------- */
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 300);
    }, 2200);
  }

  /* ---------- Copy ---------- */
  function copyText(text, btn) {
    const done = () => {
      const original = btn.textContent;
      btn.textContent = UI[currentLang].copied;
      setTimeout(() => { btn.textContent = original; }, 1500);
    };
    const fail = () => toast('Copy failed');

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallback());
    } else {
      fallback();
    }
    function fallback() {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? done() : fail();
      } catch (e) { fail(); }
    }
  }

  /* ---------- Render ---------- */
  function renderSamples() {
    sampleList.innerHTML = '';
    SAMPLES[currentLang].forEach(s => {
      const b = document.createElement('button');
      b.className = 'sample';
      b.textContent = s;
      b.onclick = () => {
        promptInput.value = s;
        updateCounter();
        promptInput.focus();
      };
      sampleList.appendChild(b);
    });
  }

  function renderModeChips() {
    modeChips.innerHTML = '';
    const labels = MODE_LABELS[currentLang];
    Object.keys(labels).forEach(key => {
      const b = document.createElement('button');
      b.className = 'chip' + (currentMode === key ? ' active' : '');
      b.textContent = labels[key];
      b.onclick = () => {
        currentMode = key;
        renderModeChips();
      };
      modeChips.appendChild(b);
    });
  }

  function applyLang() {
    const ui = UI[currentLang];
    document.documentElement.lang = currentLang;
    appSubtitle.textContent = ui.subtitle;
    tabImprove.textContent = ui.tabImprove;
    tabTranslate.textContent = ui.tabTranslate;
    lblPrompt.textContent = ui.lblPrompt;
    promptInput.placeholder = ui.placeholderPrompt;
    samplesLabel.textContent = ui.samplesLabel;
    lblMode.textContent = ui.lblMode;
    btnImproveText.textContent = ui.btnImprove;
    btnCopy.textContent = ui.copy;
    btnTranslate.textContent = ui.translateBtn;
    lblResultTrans.textContent = ui.lblResultTrans;
    srcText.placeholder = ui.placeholderSrc;
    dstText.placeholder = ui.placeholderDst;
    footerText.textContent = ui.footer;
    resultHint.textContent = ui.hint;
    langToggle.textContent = currentLang === 'id' ? 'EN' : 'ID';
    renderSamples();
    renderModeChips();
  }

  function updateCounter() {
    counter.textContent = promptInput.value.length;
  }

  /* ---------- Actions ---------- */
  function handleImprove() {
    const input = promptInput.value.trim();
    if (!input) { toast(UI[currentLang].errEmpty); promptInput.focus(); return; }

    const lang = detectLang(input);
    const mode = currentMode === 'auto' ? detectMode(input) : currentMode;
    const output = buildPrompt(input, lang, mode);

    resultText.textContent = output;
    detected.textContent =
      UI[currentLang].badgeLang + ': ' + lang.toUpperCase() +
      ' · ' + UI[currentLang].badgeMode + ': ' + MODE_LABELS[currentLang][mode];
    resultHint.textContent = UI[currentLang].hint;
    resultHint.style.display = 'block';
    result.classList.remove('hidden');
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function handleTranslate() {
    const text = srcText.value.trim();
    if (!text) { toast(UI[currentLang].errTransEmpty); srcText.focus(); return; }

    btnTranslate.disabled = true;
    btnTranslate.textContent = UI[currentLang].translateLoading;
    dstText.value = '';

    const [from, to] = currentDir.split('|');
    const url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=' + from + '%7C' + to;

    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        const status = String(data && data.responseStatus);
        const translated = data && data.responseData && data.responseData.translatedText;
        if (status !== '200' || !translated) {
          throw new Error((data && data.responseDetails) || 'Failed');
        }
        dstText.value = translated;
      })
      .catch(() => {
        dstText.value = UI[currentLang].errTransFail;
      })
      .finally(() => {
        btnTranslate.disabled = false;
        btnTranslate.textContent = UI[currentLang].translateBtn;
      });
  }

  /* ---------- Events ---------- */
  langToggle.onclick = () => {
    currentLang = currentLang === 'id' ? 'en' : 'id';
    applyLang();
  };

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      const tab = t.dataset.tab;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      panelImprove.classList.toggle('hidden', tab !== 'improve');
      panelTranslate.classList.toggle('hidden', tab !== 'translate');
    };
  });

  document.querySelectorAll('.dir-pill').forEach(p => {
    p.onclick = () => {
      currentDir = p.dataset.dir;
      document.querySelectorAll('.dir-pill').forEach(x => x.classList.toggle('active', x === p));
    };
  });

  promptInput.addEventListener('input', updateCounter);
  btnImprove.onclick = handleImprove;
  btnTranslate.onclick = handleTranslate;

  btnCopy.onclick = () => {
    if (!resultText.textContent) return;
    copyText(resultText.textContent, btnCopy);
  };
  btnCopyTrans.onclick = () => {
    if (!dstText.value) return;
    copyText(dstText.value, btnCopyTrans);
  };

  /* Ctrl/Cmd + Enter shortcut */
  promptInput.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleImprove();
  });

  /* ---------- Init ---------- */
  applyLang();
  updateCounter();
})();
</script>
</body>
</html>
